# air hot-reload configuration for `make dev`.
# Docs: https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o tmp/inventra-api ./cmd/server"
  bin = "tmp/inventra-api"
  include_ext = ["go", "html", "tmpl"]
  exclude_dir = ["web", "docs", "tmp", "vendor"]
  exclude_regex = ["_test\\.go$"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true
  main_only = true

[misc]
  clean_on_exit = true

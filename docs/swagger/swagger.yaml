basePath: /api/v1
definitions:
  auth.changePasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  auth.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.registerRequest:
    properties:
      email:
        type: string
      name:
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  auth.updateProfileRequest:
    properties:
      email:
        type: string
      name:
        minLength: 2
        type: string
    type: object
  category.createCategoryRequest:
    properties:
      description:
        type: string
      name:
        minLength: 2
        type: string
    required:
    - name
    type: object
  category.updateCategoryRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  inventory.stockRequest:
    properties:
      note:
        type: string
      product_id:
        type: string
      quantity:
        minimum: 1
        type: integer
      unit_cost:
        type: number
    required:
    - product_id
    - quantity
    type: object
  product.createProductRequest:
    properties:
      category_id:
        type: string
      description:
        type: string
      is_archived:
        type: boolean
      low_stock_threshold:
        type: integer
      name:
        minLength: 2
        type: string
      price:
        type: number
      sku:
        minLength: 2
        type: string
    required:
    - category_id
    - name
    - sku
    type: object
  product.updateProductRequest:
    properties:
      category_id:
        type: string
      description:
        type: string
      is_archived:
        type: boolean
      low_stock_threshold:
        type: integer
      name:
        type: string
      price:
        type: number
      sku:
        type: string
    type: object
  response.Body:
    properties:
      data: {}
      message:
        type: string
      pagination:
        $ref: '#/definitions/response.Pagination'
      success:
        type: boolean
    type: object
  response.Pagination:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  user.assignRoleRequest:
    properties:
      role:
        enum:
        - ADMIN
        - STAFF
        type: string
    required:
    - role
    type: object
  user.updateUserRequest:
    properties:
      email:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Inventory management REST API: auth/RBAC, products, categories, inventory
    movements, activity audit log, dashboard aggregates, and CSV reports.'
  title: Inventra Inventory API
  version: "1.0"
paths:
  /activity-logs:
    get:
      consumes:
      - application/json
      parameters:
      - description: Filter by user id
        in: query
        name: user_id
        type: string
      - description: Filter by entity type
        in: query
        name: entity_type
        type: string
      - description: Filter by entity id
        in: query
        name: entity_id
        type: string
      - description: Filter by action
        in: query
        name: action
        type: string
      - description: Start time (RFC3339)
        in: query
        name: from
        type: string
      - description: End time (RFC3339)
        in: query
        name: to
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Bad Request
          schema:

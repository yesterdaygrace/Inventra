name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (gofmt, vet, lint, test-coverage gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal cmd)
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v1.64

      - name: go test coverage gate
        env:
          DB_DSN: "host=localhost user=postgres password=postgres dbname=inventory port=5433 sslmode=disable"
        run: |
          # Coverage gate is scoped to application code under internal/;
          # cmd/ (entrypoints) and docs/swagger (generated) are uncoveable boilerplate.
          go test ./internal/... -p 1 -timeout 120s -covermode=atomic -coverprofile=coverage.out
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v c="$total" 'BEGIN { if (c < 80.0) { print "coverage gate FAILED: " c "%"; exit 1 } else { print "coverage gate PASSED: " c "%" } }'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: build
        run: npm run build